worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 30s;
    client_max_body_size 1m;

    client_body_temp_path /var/cache/nginx/client_temp 1 2;
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp 1 2;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp 1 2;
    scgi_temp_path /var/cache/nginx/scgi_temp 1 2;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        server_name _;

        return 444;
    }

    server {
        listen 8080;
        listen [::]:8080;
        server_name mazelab.spatterson.ca;

        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        etag on;

        include /etc/nginx/includes/mazelab-security.conf;
        add_header Cache-Control "no-store" always;

        if ($request_uri ~* "%00|%2e|%2f|%5c") {
            return 404;
        }

        if ($request_method !~ ^(GET|HEAD)$) {
            return 418;
        }
        error_page 418 = @method_not_allowed;

        location @method_not_allowed {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Allow "GET, HEAD" always;
            add_header Cache-Control "no-store" always;
            return 405;
        }

        location = /healthz {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store" always;
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        location = / {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store, no-transform" always;
            try_files /index.html =404;
        }

        location = /index.html {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store, no-transform" always;
            try_files $uri =404;
        }

        location = /service-worker.js {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store, no-transform" always;
            add_header Service-Worker-Allowed "/" always;
            default_type application/javascript;
            try_files $uri =404;
        }

        location = /js/python-worker.js {
            include /etc/nginx/includes/mazelab-worker-security.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            default_type application/javascript;
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store" always;
            default_type application/manifest+json;
            try_files $uri =404;
        }

        location ~ (^|/)\. {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store" always;
            return 404;
        }

        location ~* \.md$ {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store" always;
            return 404;
        }

        location @asset_not_found {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "no-store" always;
            return 404;
        }

        location / {
            include /etc/nginx/includes/mazelab-security.conf;
            add_header Cache-Control "public, max-age=0, must-revalidate" always;
            error_page 403 404 = @asset_not_found;
            try_files $uri =404;
        }
    }
}
