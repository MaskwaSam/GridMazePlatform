name: mazelab

services:
  mazelab:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        MAZELAB_GIT_COMMIT: ${MAZELAB_GIT_COMMIT:?Set MAZELAB_GIT_COMMIT from the verified clean release}
        MAZELAB_RUNTIME_SHA256: ${MAZELAB_RUNTIME_SHA256:?Set MAZELAB_RUNTIME_SHA256 from deploy/compute-runtime-sha256.sh}
        MAZELAB_SOURCE_ARCHIVE_SHA256: ${MAZELAB_SOURCE_ARCHIVE_SHA256:?Set MAZELAB_SOURCE_ARCHIVE_SHA256 from deploy/prepare-release.sh}
    image: mazelab:${MAZELAB_IMAGE_TAG:?Set a unique MAZELAB_IMAGE_TAG}
    restart: unless-stopped
    init: true
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=1777,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=101,gid=101
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header='Host: mazelab.spatterson.ca' http://127.0.0.1:8080/healthz | grep -qx healthy"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    stop_grace_period: 10s
    pids_limit: 64
    cpus: 0.50
    mem_limit: 128m
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      org.opencontainers.image.revision: ${MAZELAB_GIT_COMMIT:?Set MAZELAB_GIT_COMMIT from the verified clean release}
      ca.spatterson.mazelab.runtime-sha256: ${MAZELAB_RUNTIME_SHA256:?Set MAZELAB_RUNTIME_SHA256 from deploy/compute-runtime-sha256.sh}
      ca.spatterson.mazelab.source-archive-sha256: ${MAZELAB_SOURCE_ARCHIVE_SHA256:?Set MAZELAB_SOURCE_ARCHIVE_SHA256 from deploy/prepare-release.sh}
    networks:
      edge:
        aliases:
          - mazelab

networks:
  edge:
    name: mazelab_edge
    external: true
